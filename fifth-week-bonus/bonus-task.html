<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Week 5 — Bonus Task: To-Do List (fill in the blanks)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; }
    ul#task-list { list-style: none; padding: 0; }
    ul#task-list li { padding: 8px; border: 1px solid #ddd; margin-bottom: 4px;
      cursor: pointer; }
    ul#task-list li.done { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <h1>Bonus Task — To-Do List</h1>
  <p>Open <code>04-bonus-task.js</code>, fill in every blank, then try it here:
  type a task, click "+ Add Task" (or press Enter), and click a task to cross it
  out.</p>

  <ul id="task-list">
    <li>Buy groceries</li>
    <li>Finish homework</li>
    <li>Walk the dog</li>
    <li>
      <input id="task-input" type="text" placeholder="Add a task and press Enter" />
      <button id="add-task-btn">+ Add Task</button>
    </li>
  </ul>

  <script src="04-bonus-task.js"></script>
</body>
</html>
